# @package _global_
# HAT+TGA training configuration

defaults:
  - /dataset: wind_sr
  - /model: hat_tga
  - _self_

seed: 42
output_dir: outputs/

dataset:
  use_station_loss: true
  station_dir: data/raw/stations

trainer:
  max_epochs: 200
  gradient_clip_val: 1.0
  precision: "bf16-mixed"

  lr_g: 1.0e-4
  lr_d: 1.0e-4
  lr_scheduler: cosine
  warmup_epochs: 5

  lambda_pixel:      1.0
  lambda_perceptual: 0.1
  lambda_adv:        0.005
  lambda_physical:   0.05
  lambda_station:    0.1
  lambda_wavelet:    0.2
  wavelet_hf_weight: 2.0
  elev_weight:       2.0
  elev_threshold:    2000.0

  batch_size: 8
  num_workers: 4
  pin_memory: true

model_name: hat_tga
